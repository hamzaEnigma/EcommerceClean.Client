<table class="table table-striped">
    <thead class="thead-dark">
        <tr >
            <th>#</th>
            <th>Produit</th>
            <th>Prix unitaire</th>
            <th>Quantité</th>
            <th>Total</th>
            <th>Action</th>
        </tr>
    </thead>
    <tbody>
        @for(item of cartItems;track $index){
        <tr>
            <th scope="row">{{$index +1}}</th>
            <td>{{item.name}}  </td>
            <td>{{item.unitPrice}}</td>
            <td class="text-center align-middle">
                <input id="quantity-id" type="number" min="1"  class="form-control form-control-sm" [(ngModel)]="item.quantity" (ngModelChange)="updateQuantity($index,$event)" value="1" />
            </td>
            <td>{{item.total}}</td>
            <td>
                <button class="btn btn-danger btn-sm" (click)="deleteItem($index)">Supprimer</button>
            </td>
        </tr>
        }
        @empty {
        <tr>
            <td>{{0}}</td>
        </tr>
        }
    </tbody>
    <tfoot>
        <tr>
            <td colspan="4" align="right"><strong>Total panier :</strong></td>
            <td colspan="2"><strong>{{total}}€</strong></td>
        </tr>
    </tfoot>
</table>

<div class="divider" role="separator" aria-label="Divider"></div>

<button class="btn btn-primary" (click)="checkOut()">Checkout</button>
