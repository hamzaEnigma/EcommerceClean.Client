<table border="1" cellpadding="8" cellspacing="0" style="width:100%; border-collapse:collapse;">

            <th></th>
            <th>Identifier</th>
            <th>Customer</th>
            <th>Date commande</th>
            <th>Total</th>
        </tr>
    </thead>
    <tbody>
        @for (item of orders; track $index) {
        <tr>
            <td>{{$index + 1 }}</td>
            <td>{{item.orderId }}</td>
            <td>{{item.customer}}</td>
            <td>{{item.orderDate }}</td>
            <td>{{item.total }}</td>
        </tr>
        }
    </tbody>
    <tfoot>

    </tfoot>
</table>
