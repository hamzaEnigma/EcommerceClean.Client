<table class="table table-striped">
  <thead class="thead-dark">
        <tr>
            <th>#</th>
            <th>Name</th>
            <th>Description</th>
            <th>Sell price</th>
            <th>Category</th>
            <th>Stock</th>
            <th>Actions</th>
        </tr>
    </thead>
    <tbody id="productTable">
        @for (item of products; track $index){
        <tr>
            <th scope="row">{{$index +1}}</th>
            <td>{{item.name }}</td>
            <td>{{item.description }}</td>
            <td>{{item.sellPrice}}</td>
            <td>{{item.category.name}}</td>
            <td>{{item.stockLimit}}</td>
            <td><button class="btn btn-primary btn-sm" (click)="addProductToChart(item)">Ajouter au panier</button></td>
        </tr>
        }  @empty {
        There are no items.
        }
    </tbody>
</table>
